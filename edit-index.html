<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUBAS ICE Student Grade Checker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c1669">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f3f7fb;color:#1c1669;padding:16px}
.screen{display:none}
.screen.active{display:block}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:16px}
h1,h2{margin-bottom:12px}
p{margin-bottom:12px}
label{display:block;font-weight:bold;margin:10px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px;margin-bottom:10px}
button{width:100%;padding:14px;border:none;border-radius:8px;font-size:16px;font-weight:bold;margin-bottom:10px;cursor:pointer}
.primary{background:#1c1669;color:#fff}
.secondary{background:#e6e9f5;color:#1c1669}
.danger{background:#c62828;color:#fff}
.small{font-size:14px;color:#555}
.list-item{background:#f6f7fb;border-radius:8px;padding:10px;margin-bottom:8px}
.row{display:flex;gap:8px}
.row button{margin-bottom:0}
.hidden{display:none}
</style>
</head>
<body>

<section id="start" class="screen active">
<div class="card">
<h2>Welcome</h2>
<p>Choose a student or add a new student.</p>
<label>Saved students</label>
<select id="studentSelect"></select>
<button class="primary" onclick="openStudent()">Continue</button>
<button class="secondary" onclick="showNewStudent()">Add new student</button>
</div>

<div id="newStudentCard" class="card hidden">
<h2>Add student</h2>
<label>Full name</label>
<input id="fullName" placeholder="e.g. Chikondi Banda">
<button class="primary" onclick="saveName()">Save and continue</button>
<button class="secondary" onclick="showStart()">Back</button>
</div>
</section>

<section id="home" class="screen">
<div class="card">
<h2 id="welcomeName">Welcome</h2>
<p>What would you like to do?</p>
<button class="primary" onclick="showScreen('grades')">Check grades</button>
<button class="primary" onclick="showScreen('timetable')">Timetable</button>
<button class="primary" onclick="showScreen('results')">Results and progress</button>
<button class="primary" onclick="showScreen('backup')">Backup or restore</button>
<button class="secondary" onclick="changeStudent()">Change student</button>
</div>
</section>

<section id="grades" class="screen">
<div class="card">
<h2>Check grades</h2>
<button class="primary" onclick="showScreen('oneGrade')">Check one module</button>
<button class="primary" onclick="showScreen('allGrades')">Check all modules</button>
<button class="secondary" onclick="showScreen('home')">Back</button>
</div>
</section>

<section id="oneGrade" class="screen">
<div class="card">
<h2>One module</h2>
<label>Module name</label>
<input id="oneModuleName" placeholder="e.g. Programming">
<label>Score</label>
<input id="oneModuleScore" type="number" min="0" max="100" placeholder="e.g. 72">
<button class="primary" onclick="checkOneGrade()">Check grade</button>
<div id="oneGradeResult"></div>
<button class="secondary" onclick="showScreen('grades')">Back</button>
</div>
</section>

<section id="allGrades" class="screen">
<div class="card">
<h2>All modules</h2>
<div id="moduleInputs"></div>
<button class="primary" onclick="addModuleInput()">Add another module</button>
<button class="primary" onclick="checkAllGrades()">Check all grades</button>
<div id="allGradesResult"></div>
<button class="secondary" onclick="showScreen('grades')">Back</button>
</div>
</section>

<section id="timetable" class="screen">
<div class="card">
<h2>Timetable</h2>
<label>Subject or module</label>
<input id="sessionSubject" placeholder="e.g. Mathematics">
<label>Day</label>
<select id="sessionDay">
<option>Monday</option><option>Tuesday</option><option>Wednesday</option>
<option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
</select>
<label>Time</label>
<input id="sessionTime" type="time">
<label>Topic</label>
<input id="sessionTopic" placeholder="e.g. Algebra">
<button class="primary" onclick="addSession()">Add session</button>
<div id="sessionList"></div>
<button class="secondary" onclick="showScreen('home')">Back</button>
</div>
</section>

<section id="results" class="screen">
<div class="card">
<h2>Results and progress</h2>
<div id="progressArea"></div>
<button class="secondary" onclick="showScreen('home')">Back</button>
</div>
</section>

<section id="backup" class="screen">
<div class="card">
<h2>Backup or restore</h2>
<button class="primary" onclick="downloadBackup()">Download backup</button>
<label>Restore backup</label>
<input id="restoreFile" type="file" accept=".json">
<button class="primary" onclick="restoreBackup()">Restore</button>
<button class="secondary" onclick="showScreen('home')">Back</button>
</div>
</section>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
</script>

<script>
let students = JSON.parse(localStorage.getItem('mubas_students') || '[]');
let currentStudent = null;

function saveStudents(){localStorage.setItem('mubas_students',JSON.stringify(students));}

function showScreen(id){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
if(id==='start')loadStudentList();
if(id==='timetable')showSessions();
if(id==='results')showProgress();
}

function showStart(){
document.getElementById('newStudentCard').classList.add('hidden');
showScreen('start');
}

function showNewStudent(){
document.getElementById('newStudentCard').classList.remove('hidden');
}

function loadStudentList(){
let select=document.getElementById('studentSelect');
select.innerHTML='';
if(students.length===0){
let option=document.createElement('option');
option.textContent='No students saved yet';
option.value='';
select.appendChild(option);
}else{
students.forEach((s,i)=>{
let option=document.createElement('option');
option.value=i;
option.textContent=s.name;
select.appendChild(option);
});
}
}

function saveName(){
let name=document.getElementById('fullName').value.trim();
if(!name){alert('Please enter a full name.');return;}
let student={name:name,grades:[],sessions:[]};
students.push(student);
saveStudents();
currentStudent=student;
document.getElementById('fullName').value='';
openHome();
}

function openStudent(){
let index=document.getElementById('studentSelect').value;
if(index===''){alert('Please add a student first.');return;}
currentStudent=students[index];
openHome();
}

function openHome(){
document.getElementById('welcomeName').textContent='Welcome, '+currentStudent.name;
showScreen('home');
}

function changeStudent(){
currentStudent=null;
showStart();
}

function gradeFor(score){
if(score>=75)return'Distinction';
if(score>=60)return'Merit';
if(score>=40)return'Pass';
return'Fail';
}

function checkOneGrade(){
let name=document.getElementById('oneModuleName').value.trim();
let score=Number(document.getElementById('oneModuleScore').value);
if(!name||isNaN(score)||score<0||score>100){alert('Enter a module name and a score from 0 to 100.');return;}
let grade=gradeFor(score);
document.getElementById('oneGradeResult').innerHTML='<div class="card"><h3>'+name+'</h3><p>Score: '+score+'%</p><p>Grade: '+grade+'</p></div>';
currentStudent.grades.push({name:name,score:score,grade:grade});
saveStudents();
}

function addModuleInput(){
let area=document.getElementById('moduleInputs');
let div=document.createElement('div');
div.className='list-item';
div.innerHTML='<input class="moduleName" placeholder="Module name"><input class="moduleScore" type="number" min="0" max="100" placeholder="Score">';
area.appendChild(div);
}

function checkAllGrades(){
let names=document.querySelectorAll('.moduleName');
let scores=document.querySelectorAll('.moduleScore');
let total=0,count=0,html='';
for(let i=0;i<names.length;i++){
let name=names[i].value.trim();
let score=Number(scores[i].value);
if(name&&!isNaN(score)&&score>=0&&score<=100){
let grade=gradeFor(score);
html+='<div class="list-item"><b>'+name+'</b><br>Score: '+score+'%<br>Grade: '+grade+'</div>';
currentStudent.grades.push({name:name,score:score,grade:grade});
total+=score;count++;
}
}
if(count===0){alert('Enter at least one module and score.');return;}
let average=Math.round(total/count);
html+='<div class="card"><h3>Average</h3><p>'+average+'%</p><p>Overall grade: '+gradeFor(average)+'</p></div>';
document.getElementById('allGradesResult').innerHTML=html;
saveStudents();
}

function addSession(){
let subject=document.getElementById('sessionSubject').value.trim();
let day=document.getElementById('sessionDay').value;
let time=document.getElementById('sessionTime').value;
let topic=document.getElementById('sessionTopic').value.trim();
if(!subject||!time){alert('Enter a subject and time.');return;}
currentStudent.sessions.push({subject:subject,day:day,time:time,topic:topic,status:'Not done'});
saveStudents();
document.getElementById('sessionSubject').value='';
document.getElementById('sessionTime').value='';
document.getElementById('sessionTopic').value='';
showSessions();
}

function showSessions(){
let area=document.getElementById('sessionList');
area.innerHTML='';
if(!currentStudent.sessions.length){area.innerHTML='<p class="small">No sessions added yet.</p>';return;}
currentStudent.sessions.forEach((s,i)=>{
let div=document.createElement('div');
div.className='list-item';
div.innerHTML='<b>'+s.subject+'</b><br>'+s.day+' '+s.time+'<br>'+s.topic+'<br>Status: '+s.status+
'<br><button class="secondary" onclick="setStatus('+i+',\'Done\')">Done</button>'+
'<button class="secondary" onclick="setStatus('+i+',\'Partly done\')">Partly done</button>'+
'<button class="secondary" onclick="setStatus('+i+',\'Missed\')">Missed</button>'+
'<button class="danger" onclick="deleteSession('+i+')">Delete</button>';
area.appendChild(div);
});
}

function setStatus(index,status){
currentStudent.sessions[index].status=status;
saveStudents();
showSessions();
}

function deleteSession(index){
currentStudent.sessions.splice(index,1);
saveStudents();
showSessions();
}

function showProgress(){
let area=document.getElementById('progressArea');
let html='<h3>Saved grades</h3>';
if(currentStudent.grades.length===0){html+='<p class="small">No grades saved yet.</p>';}
currentStudent.grades.forEach(g=>{html+='<div class="list-item">'+g.name+': '+g.score+'% - '+g.grade+'</div>';});
html+='<h3>Timetable progress</h3>';
if(currentStudent.sessions.length===0){html+='<p class="small">No timetable sessions yet.</p>';}
let done=0,partly=0,missed=0;
currentStudent.sessions.forEach(s=>{
if(s.status==='Done')done++;
if(s.status==='Partly done')partly++;
if(s.status==='Missed')missed++;
});
html+='<div class="list-item">Done: '+done+'<br>Partly done: '+partly+'<br>Missed: '+missed+'</div>';
area.innerHTML=html;
}

function downloadBackup(){
let data=JSON.stringify(students);
let blob=new Blob([data],{type:'application/json'});
let link=document.createElement('a');
link.href=URL.createObjectURL(blob);
link.download='mubas-grade-checker-backup.json';
link.click();
}

function restoreBackup(){
let file=document.getElementById('restoreFile').files[0];
if(!file){alert('Choose a backup file first.');return;}
let reader=new FileReader();
reader.onload=function(){
try{
students=JSON.parse(reader.result);
saveStudents();
alert('Backup restored.');
showStart();
}catch(error){alert('This file is not a valid backup.');}
};
reader.readAsText(file);
}

showStart();
</script>
</body>
</html>
